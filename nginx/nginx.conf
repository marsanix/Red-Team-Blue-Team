# nginx - Web server / reverse proxy (Fase 1, Administrasi).
# Container nginx adalah satu-satunya service yang di-publish ke host (port 80),
# sehingga menjadi pintu masuk dari DMZ ke backend (flask).
user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Sembunyikan banner versi nginx (banner grab / fingerprint).
    server_tokens off;

    sendfile on;

    # ---- Rate limiting (konfigurasi admin Fase 1) ----
    # Maksimal 10 request/detik per IP asal; burst 20 diserap (nodelay).
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ---- Mapping header untuk WebSocket ----
    # "Connection: upgrade" hanya dikirim bila klien meminta Upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # Container SELALU dengar di port 80 internal. Pilihan port HOST
        # diatur di docker-compose (ports: "${HTTP_PORT:-80}:80") - nginx
        # tidak melakukan env-substitusi pada config (nginx.conf di-mount
        # langsung, tanpa envsubst). Tailscale & port host dua-duanya
        # menunjuk ke 80 dalam container.
        listen 80;
        server_name _;

        # Security headers dasar (diperkuat pada Fase 3 / hardening).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # Halaman awal -> daftar endpoint (memudahkan navigasi/recon).
        location = / {
            return 302 /api/;
        }

        # ---- REST API (sinkron) ----
        # /api (tanpa slash) harus tetap diteruskan, bukan di-301 ke /api/
        location = /api {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://flask:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://flask:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---- WebSocket (asinkron) ----
        location /ws/ {
            proxy_pass http://flask:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Wajib besar agar koneksi WebSocket idle tidak diputus nginx.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Streaming WebSocket tidak boleh di-buffer oleh nginx.
            proxy_buffering off;
        }
    }
}
