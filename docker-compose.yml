# ============================================================
# docker-compose - Topologi DMZ microservices (Fase 1)
#
#   Network dmz     10.10.0.0/24  : nginx (10.10.0.10), flask (10.10.0.11)
#   Network internal 10.10.2.0/24 : flask (10.10.2.11), mysql (10.10.2.12)
#
#   Hanya nginx yang di-publish ke host (port 80). Flask & MySQL TIDAK
#   di-publish -> segmentasi DMZ. MySQL hanya bisa diakses dari network
#   internal, tidak dari network dmz maupun host.
#
#   IP statis dikonfigurasi via `ipv4_address` + subnet eksplisit.
# ============================================================
name: uas-kelompok5

services:
  nginx:
    # Web server = NODE TAILNET. tailscaled berjalan di dalam container
    # (lihat nginx/Dockerfile + entrypoint.sh). Attacker menyerang langsung
    # ke alamat tailnet web server (100.x.y.z:80), bukan lewat port host.
    build: ./nginx
    restart: unless-stopped
    ports:
      # Port host untuk akses DEV / fallback. Default 80 (server Ubuntu);
      # override via HTTP_PORT di .env bila bentrok di mesin dev (mis. 8081).
      - "${HTTP_PORT:-80}:80"
    env_file:
      - .env        # TS_AUTHKEY, TS_HOSTNAME (tailscale) untuk container ini
    cap_add:
      - NET_ADMIN   # dibutuhkan tailscaled untuk membuat interface tailscale0
      - NET_RAW
    devices:
      - "/dev/net/tun:/dev/net/tun"   # device tun untuk WireGuard/tailscale
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      dmz:
        ipv4_address: 10.10.0.10
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      dmz:
        ipv4_address: 10.10.0.11
        aliases:
          - flask          # alias agar "flask" ter-resolve di network dmz
      internal:
        ipv4_address: 10.10.2.11
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      internal:
        ipv4_address: 10.10.2.12
    healthcheck:
      # `$$` agar compose TIDAK mengekspansi $MYSQL_ROOT_PASSWORD (container yang mengganti).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24

volumes:
  db_data:
